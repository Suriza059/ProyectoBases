<section class="login">

  <h1 class="login-titulo">Iniciar sesión</h1>

  <p class="login-subtitulo">
    Acceso para administrador, analista y guarda
  </p>

  <form class="login-formulario" (ngSubmit)="ingresar()">
    <label class="campo-etiqueta" for="usuario">Usuario</label>
    <input
      class="campo"
      id="usuario"
      name="usuario"
      type="text"
      placeholder="Escribe tu usuario"
      autocomplete="username"
      [(ngModel)]="usuario"
    >

    <label class="campo-etiqueta" for="contrasena">Contraseña</label>
    <input
      class="campo"
      id="contrasena"
      name="contrasena"
      type="password"
      placeholder="Escribe tu contraseña"
      autocomplete="current-password"
      [(ngModel)]="contrasena"
    >

    <p class="mensaje-error" *ngIf="error">
      {{ error }}
    </p>

    <p class="mensaje-exito" *ngIf="rolIniciado">
      Ingresaste como {{ rolIniciado }}. Aquí se abrirá tu panel.
    </p>

    <button class="btn-entrar" type="submit">Entrar</button>
  </form>

  <a class="volver" routerLink="/">← Volver al inicio</a>

</section>
